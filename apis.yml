name: payflows
description: Payflows is an AI-native financial operations platform that unifies procurement, treasury,
  and accounting into one agentic workspace for finance teams. Its product suites span Apollo (procurement
  from purchase request to receipt), Vera (vendor and contract management), Athena (accounting and AP
  automation from AP to tax reporting), and Metis (treasury from payment to bank reconciliation), with
  spend analytics, cashflow forecasting, global payments, and risk management. Payflows integrates with
  major ERP, banking, payment, and expense systems. It was surfaced as a portfolio company of Balderton
  Capital and Ribbit Capital and added to the API Evangelist network.
